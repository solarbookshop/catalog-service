apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-config
  labels:
    app: catalog-service
data:
  application.yml: |
    solar:
      greeting: Welcome to the book catalog from Kubernetes 👋
    spring:
      datasource:
        url: jdbc:postgresql://solar-postgres/solardb_catalog
      security:
        oauth2:
          resourceserver:
            jwt:
              issuer-uri: http://solar-keycloak/realms/SolarBookshop